<!DOCTYPE html>

<html>

<head>

<title>ESP32 GPIO Control</title>

<style>

body
{
    background-color: black;
    color: white;
    font-family: "Times New Roman";
    text-align: center;
    padding-top: 450px;
}

button
{
    background-color: green;
    color: white;
    font-size: 80px;
    padding: 50px 160px;
    margin: 30px;
    border: none;
    border-radius: 10px;
}

</style>

</head>

<body>

<h1>ESP32 GPIO Control</h1>

<h2>GPIO2 Status</h2>

<p>
<button onclick="sendOn()">LAMP ON</button>
</p>

<p>
<button onclick="sendOff()">LAMP OFF</button>
</p>

<p id="status">Ready</p>

<script>

function sendOn()
{
    fetch("https://esp32-lamp-relay.g0ure1066.workers.dev/?cmd=on");

    document.getElementById("status").innerHTML = "LAMP ON command sent";
}


function sendOff()
{
    fetch("https://esp32-lamp-relay.g0ure1066.workers.dev/?cmd=off");

    document.getElementById("status").innerHTML = "LAMP OFF command sent";
}

</script>

</body>

</html>
