<!DOCTYPE html> <html> <head> <title>ESP32 GPIO Control</title> <style> body { background-color: blue; color: white; font-family: "Times New Roman"; text-align: center; padding-top: 450px; } button { background-color: green; color: white; font-size: 80px; padding: 50px 160px; margin: 30px; border: none; border-radius: 10px; } </style> <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.15.2/mqtt.min.js"></script> </head> <body> <h1>ESP32 GPIO Control</h1> <h2>GPIO2 Status</h2> <p> <button onclick="sendOn()">LAMP ON</button> </p> <p> <button onclick="sendOff()">LAMP OFF</button> </p> <p id="status">Connecting to MQTT...</p> <script> const client = mqtt.connect("wss://test.mosquitto.org:8081"); client.on("connect", function() { document.getElementById("status").innerHTML = "MQTT Connected"; }); function sendOn() { client.publish("IanLedOn", "Gpio2On"); } function sendOff() { client.publish("IanLedOn", "Gpio2Off"); } </script> </body> </html>
